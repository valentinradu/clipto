[package]
name = "clipd"
version = "0.1.0"
edition = "2021"

[dependencies]
clipto-ipc = { path = "../clipto-ipc" }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
anyhow = "1"
ctrlc = "3"
inotify = "0.10"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2.189"
# Only the primitives that `Noise_XXpsk3_25519_ChaChaPoly_BLAKE2s` names. The
# default features add AES-GCM and SHA-2, which this pattern never asks for.
#
# The `std` feature is off as well. It reads `ring/std`, and that spelling turns
# on the optional `ring` dependency, which needs a C compiler. Without `std`,
# snow takes `Box` from `alloc` instead. It changes no primitive.
snow = { version = "0.10.0", default-features = false, features = [
  "default-resolver",
  "use-curve25519",
  "use-chacha20poly1305",
  "use-blake2",
  "use-getrandom",
] }
hkdf = "0.12"
sha2 = "0.10"
toml = "0.8"
serde_json = "1"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
httparse = "1.10.1"

[dev-dependencies]
tempfile = "3.27.0"
